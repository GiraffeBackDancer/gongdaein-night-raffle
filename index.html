<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>공대인의 밤 추첨</title>
    <style>
        @font-face {
            font-family: 'Galmuri11';
            src: url('fonts/Galmuri11.woff2') format('woff2');
            font-weight: normal;
        }

        @font-face {
            font-family: 'Galmuri11';
            src: url('fonts/Galmuri11-Bold.woff2') format('woff2');
            font-weight: bold;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b1026;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 4vmin;
            font-family: 'Galmuri11', sans-serif;
        }

        .ball {
            width: 40vmin;
            cursor: pointer;
            transform-origin: bottom center;
            display: none;
        }

        .ball img {
            width: 100%;
            display: block;
        }

        .setup {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            color: white;
            text-align: center;
        }

        .setup-title {
            margin: 0;
            font-size: 56px;
            color: #f2c14e;
            text-shadow: 0 0 20px rgba(242, 193, 78, 0.5);
        }

        .setup-sub {
            margin: 0;
            font-size: 22px;
            opacity: 0.8;
        }

        .folder-btn {
            margin-top: 24px;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: bold;
            color: #0b1026;
            background: #f2c14e;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .folder-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(242, 193, 78, 0.4);
        }

        .setup-count {
            margin: 0;
            font-size: 18px;
        }

        .setup-hint {
            margin: 0;
            font-size: 14px;
            opacity: 0.6;
        }

        .ball.shaking {
            animation: shake 2s ease-in-out;
        }

        @keyframes shake {
            0% {
                transform: rotate(0deg);
            }

            8% {
                transform: rotate(-6deg);
            }

            16% {
                transform: rotate(5deg);
            }

            24% {
                transform: rotate(-4deg);
            }

            32% {
                transform: rotate(0deg);
            }

            45% {
                transform: rotate(0deg);
            }

            52% {
                transform: rotate(-10deg);
            }

            58% {
                transform: rotate(10deg);
            }

            64% {
                transform: rotate(-13deg);
            }

            70% {
                transform: rotate(13deg);
            }

            76% {
                transform: rotate(-16deg);
            }

            82% {
                transform: rotate(16deg);
            }

            88% {
                transform: rotate(-12deg);
            }

            94% {
                transform: rotate(6deg);
            }

            100% {
                transform: rotate(0deg);
            }
        }

        .reveal {
            display: none;
        }

        .reveal img {
            width: 55vmin;
            height: 55vmin;
            object-fit: contain;
            display: block;
        }

        .pokemon-name {
            margin: 3vmin 0 0;
            color: white;
            font-size: 9vmin;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 20px #f2c14e;
        }

        .reveal.show {
            display: block;
            animation: pop-in 1.2s ease-out;
        }

        @keyframes pop-in {
            0% {
                transform: scale(0.2);
                opacity: 0;
            }

            60% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(1);
            }
        }

        .flash {
            position: fixed;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
        }

        .flash.active {
            animation: flash 1.5s ease-out;
        }

        @keyframes flash {
            0% {
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            35% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="setup" id="setup">
        <h1 class="setup-title">공대인의 밤</h1>
        <p class="setup-sub">포켓몬 추첨</p>

        <label class="folder-btn" for="folderInput">포켓몬 이미지 폴더 선택</label>
        <input type="file" id="folderInput" webkitdirectory hidden>

        <p class="setup-count">불러온 이미지: <span id="imageCount">0</span>장</p>
        <p class="setup-hint">폴더를 고르면 추첨 화면으로 전환됩니다 · 스페이스바 / → / 클릭으로 진행</p>
    </div>
    <div class="ball" id="ball">
        <img src="assets/ball.png" alt="볼">
    </div>
    <div class="reveal" id="reveal">
        <img id="pokemonImg" alt="">
        <p class="pokemon-name" id="pokemonName"></p>
    </div>
    <div class="flash" id="flash"></div>
    <script>
        const folderInput = document.getElementById('folderInput');
        const imageCount = document.getElementById('imageCount');
        const setup = document.getElementById('setup');
        const ball = document.getElementById('ball');
        const flash = document.getElementById('flash');
        const reveal = document.getElementById('reveal');
        const pokemonImg = document.getElementById('pokemonImg');
        const pokemonName = document.getElementById('pokemonName');

        const IMAGE_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
        let pokemons = [];
        let isDrawing = false;
        let picked = null;

        folderInput.addEventListener('change', () => {
            const files = Array.from(folderInput.files);

            const imageFiles = files.filter(file => IMAGE_TYPES.includes(file.type));

            pokemons = imageFiles.map(file => {
                return {
                    name: file.name.slice(0, file.name.lastIndexOf('.')),
                    file: file,
                    url: URL.createObjectURL(file)
                };
            });

            imageCount.textContent = pokemons.length;
            console.log(pokemons);
            if (pokemons.length === 0) {
                alert('이미지 파일이 없는 폴더예요. 다시 선택해주세요.');
                return;
            }

            setup.style.display = 'none';
            ball.style.display = 'block';
        });
        function startDraw() {
            if (pokemons.length === 0) {
                alert('모든 포켓몬이 뽑혔어요!');
                return;
            }
            if (isDrawing) {
                return;
            }
            isDrawing = true;
            const index = Math.floor(Math.random() * pokemons.length);
            picked = pokemons[index];
            pokemons.splice(index, 1);
            console.log('남은 후보:', pokemons.length);
            pokemonImg.src = picked.url;
            pokemonName.textContent = picked.name;
            console.log('당첨:', picked.name);
            ball.classList.add('shaking');
        }
        ball.addEventListener('click', startDraw);
        ball.addEventListener('animationend', () => {
            ball.classList.remove('shaking');
            flash.classList.add('active');

            setTimeout(() => {
                ball.style.display = 'none';
                reveal.classList.add('show');
            }, 300);
        });

        flash.addEventListener('animationend', () => {
            flash.classList.remove('active');
            isDrawing = false;
        });
        const ACTION_KEYS = [' ', 'Enter', 'ArrowRight', 'PageDown'];

        document.addEventListener('keydown', (e) => {
            if (!ACTION_KEYS.includes(e.key)) {
                return;
            }
            e.preventDefault();

            if (isDrawing) {
                return;
            }

            if (reveal.classList.contains('show')) {
                reveal.classList.remove('show');
                ball.style.display = 'block';
            } else if (ball.style.display === 'block') {
                startDraw();
            }
        });
    </script>
</body>

</html>
